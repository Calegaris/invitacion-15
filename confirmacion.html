<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>15 años · Sofía Belén Oviedo</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="confirmacion.css" />
</head>

<body>

  <div class="pagina">
    <!-- SLIDESHOW DE FONDO -->
    <div class="slide-bg">
      <img src="fotos/sofia4.jpeg" alt="" class="activa" />
      <img src="fotos/sofia5.png" alt="" />
      <img src="fotos/sofia6.png" alt="" />
      <img src="fotos/sofia7.webp" alt="" />
      <img src="fotos/sofia8.webp" alt="" />
      <img src="fotos/sofia9.webp" alt="" />
    </div>

    <!-- ENCABEZADO -->
    <header id="encabezado">
      <p class="pre-titulo">mis quince años</p>
      <h1 class="nombre-script">Sofía Belén</h1>
      <div class="linea-decorativa"></div>
      <p class="fecha-chica">30 · 05 · 2026</p>
    </header>


    <!-- CONTADOR -->
    <section id="contador">
      <p class="contador-label">faltan</p>
      <div class="contador-bloques">
        <div class="bloque">
          <span id="dias">00</span>
          <p>días</p>
        </div>
        <div class="bloque">
          <span id="horas">00</span>
          <p>horas</p>
        </div>
        <div class="bloque">
          <span id="minutos">00</span>
          <p>minutos</p>
        </div>
        <div class="bloque">
          <span id="segundos">00</span>
          <p>segundos</p>
        </div>
      </div>
    </section>

    <!-- CONFIRMACIÓN + DIRECCIÓN -->
    <section id="confirmacion">
      <p class="espera-label">te esperamos a partir de las 21:00hs</p>
      <p class="confirmacion-label">¿nos vemos ahí?</p>
      <a class="whatsapp-btn" id="btnWhatsapp" href="#" target="_blank">
        ¡Voy a estar! 🎉
      </a>
      <div class="direccion-bloque">
        <p class="direccion-texto">Matheu 2153</p>
        <p class="direccion-sub">Moreno · Provincia de Buenos Aires</p>
        <a class="mapa-btn" href="https://maps.app.goo.gl/wq9u9tYkTWakgHL39" target="_blank">
          cómo llegar →
        </a>
      </div>
    </section>

  </div>

  <!-- REPRODUCTOR SPOTIFY CUSTOM -->
  <div id="reproductor-wrapper" class="reproductor-container expandido">
    <div class="reproductor-header" id="reproductor-header-toggle" title="Minimizar/Maximizar">
      <div class="reproductor-info">
        <span class="spotify-icon">♪</span>
        <div>
          <span class="reproductor-titulo">Playlist para tu invitación</span>
        </div>
      </div>
    </div>
    <div class="reproductor-content">
      <iframe src="https://open.spotify.com/embed/playlist/6FEVoJQxlOti4NIRlbBqHU?utm_source=generator" width="100%"
        height="80" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy" class="reproductor-iframe">
      </iframe>
    </div>
  </div>

  <!-- AUDIO DE FONDO -->
  <audio id="audio-fondo" src="audio/fondo.mp3" loop preload="auto" style="display:none;"></audio>

  <script src="script.js"></script>
</body>

</html>
