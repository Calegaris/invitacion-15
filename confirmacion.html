<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>15 años · Sofía Valentina Herrera</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="confirmacion.css" />
</head>
<body>

  <div class="pagina">

    <!-- ENCABEZADO -->
    <header id="encabezado">
      <p class="pre-titulo">mis quince años</p>
      <h1 class="nombre-script">Sofía Valentina Herrera</h1>
      <div class="linea-decorativa"></div>
      <p class="fecha-chica">18 · 04 · 2026</p>
    </header>

    <!-- FOTO -->
    <section id="foto-sofia">
      <div class="foto-wrapper">
        <img src="fotos/sofia.png" alt="Sofía Valentina Herrera" />
      </div>
    </section>

    <!-- CONTADOR -->
    <section id="contador">
      <p class="contador-label">faltan</p>
      <div class="contador-bloques">
        <div class="bloque">
          <span id="dias">00</span>
          <p>días</p>
        </div>
        <div class="bloque">
          <span id="horas">00</span>
          <p>horas</p>
        </div>
        <div class="bloque">
          <span id="minutos">00</span>
          <p>minutos</p>
        </div>
        <div class="bloque">
          <span id="segundos">00</span>
          <p>segundos</p>
        </div>
      </div>
    </section>

    <!-- CONFIRMACIÓN + DIRECCIÓN -->
    <section id="confirmacion">
      <p class="confirmacion-label">¿nos vemos ahí?</p>
      <a class="whatsapp-btn" id="btnWhatsapp" href="#" target="_blank">
        ¡Voy a estar! 🎉
      </a>
      <div class="direccion-bloque">
        <p class="direccion-texto">Juan Manuel Blanes 1400</p>
        <p class="direccion-sub">Mariano Acosta · Provincia de Buenos Aires</p>
        <a class="mapa-btn"
           href="https://www.google.com/maps/search/?api=1&query=Juan+Manuel+Blanes+1400+Mariano+Acosta+Buenos+Aires"
           target="_blank">
          cómo llegar →
        </a>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
