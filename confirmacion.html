<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>15 años · Sofía Belén Oviedo</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="confirmacion.css" />
</head>

<body>

  <div class="pagina">
    <!-- SLIDESHOW DE FONDO -->
    <div class="slide-bg">
      <img src="fotos/sofia4.jpeg" alt="" class="activa" />
      <img src="fotos/sofia5.jpeg" alt="" />
      <img src="fotos/sofia6.jpeg" alt="" />
      <img src="fotos/sofia7.jpeg" alt="" />
      <img src="fotos/sofia8.jpeg" alt="" />
      <img src="fotos/sofia9.jpeg" alt="" />
    </div>

    <!-- ENCABEZADO -->
    <header id="encabezado">
      <p class="pre-titulo">mis quince años</p>
      <h1 class="nombre-script">Sofía Belén</h1>
      <div class="linea-decorativa"></div>
      <p class="fecha-chica">31 · 05 · 2026</p>
    </header>


    <!-- CONTADOR -->
    <section id="contador">
      <p class="contador-label">faltan</p>
      <div class="contador-bloques">
        <div class="bloque">
          <span id="dias">00</span>
          <p>días</p>
        </div>
        <div class="bloque">
          <span id="horas">00</span>
          <p>horas</p>
        </div>
        <div class="bloque">
          <span id="minutos">00</span>
          <p>minutos</p>
        </div>
        <div class="bloque">
          <span id="segundos">00</span>
          <p>segundos</p>
        </div>
      </div>
    </section>

    <!-- CONFIRMACIÓN + DIRECCIÓN -->
    <section id="confirmacion">
      <p class="confirmacion-label">¿nos vemos ahí?</p>
      <a class="whatsapp-btn" id="btnWhatsapp" href="#" target="_blank">
        ¡Voy a estar! 🎉
      </a>
      <div class="direccion-bloque">
        <p class="direccion-texto">Juan Manuel Blanes 1400</p>
        <p class="direccion-sub">Mariano Acosta · Provincia de Buenos Aires</p>
        <a class="mapa-btn"
          href="https://www.google.com/maps/search/?api=1&query=Juan+Manuel+Blanes+1400+Mariano+Acosta+Buenos+Aires"
          target="_blank">
          cómo llegar →
        </a>
      </div>
    </section>

  </div>

  <!-- REPRODUCTOR SPOTIFY -->
  <iframe src="https://open.spotify.com/embed/playlist/6FEVoJQxlOti4NIRlbBqHU?utm_source=generator" width="100%"
    height="80" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
    loading="lazy"
    style="position:fixed; bottom:0; left:0; right:0; z-index:9997; border-radius:0; border-top: 1px solid rgba(123,21,46,0.4); max-height: 90px;">
  </iframe>

  <script src="script.js"></script>
</body>

</html>
